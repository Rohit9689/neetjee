  <title>ELAPP the Perfect Guide | NEET and JEE Exam Preparation App</title>

  <style type="text/css">
    body {
      margin: 0;
      padding: 0;

    }

    .text-primary {
      color: #007bff !important;
    }

    .preloader {
      background-color: #ffffff !important;
      bottom: 0;
      display: block;
      left: 0;
      position: fixed;
      right: 0;
      top: 0;
      z-index: 9999;
    }

    .ELAPP-effects {
      color: #dcdce2;
      position: absolute;
      top: 50%;
      left: 50%;
      margin-left: -90px;
      margin-top: -90px;
      width: 200px;
      height: 200px;
      text-align: center;
      line-height: 260px;
      -webkit-font-smoothing: antialiased;
    }

    .spinner-border {
      display: inline-block;
      width: 2rem;
      height: 2rem;
      vertical-align: text-bottom;
      border: .25em solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      -webkit-animation: spinner-border .75s linear infinite;
      animation: spinner-border .75s linear infinite;
    }

    .spinner-border .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @keyframes spinner-border {
      to {
        transform: rotate(360deg);
        -webkit-transform: rotate(360deg);
        -moz-transform: rotate(360deg);
        -o-transform: rotate(360deg);
      }
    }
  </style>

  <link rel="preload" href="https://rizee.in/static/fontawesome/webfonts/fa-brands-400.woff2" as="font"
    type="font/woff2" crossorigin>

  <div id="root">
